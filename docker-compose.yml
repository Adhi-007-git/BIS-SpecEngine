version: '3.8'

services:
  # Relational Database: PostgreSQL for document metadata, audit trail, standards catalogue
  postgres:
    image: postgres:16-alpine
    container_name: sih26108_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih_standards
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_standards"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vector Database: Qdrant for semantic search over standards and tender chunks
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sih26108_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  # Knowledge Graph: Neo4j for relationships (NORMATIVE_REFERENCE, REQUIRES_TESTING_VIA, etc.)
  neo4j:
    image: neo4j:5.18.0-community
    container_name: sih26108_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP Web Interface
      - "7687:7687"  # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/sih_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
